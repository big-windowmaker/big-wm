name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    container:
      # manjarolinux/base:latest, fixado por digest (atualizado pelo mantenedor).
      image: docker.io/manjarolinux/base@sha256:a411decb8d219cb4b16b39618e9aa8ce8228acad9cba5b10420f804a20ca5c84
    steps:
      - name: Preparar ambiente de build
        run: |
          pacman -Syu --noconfirm --needed base-devel git python desktop-file-utils librsvg shellcheck \
            meson gtk3 gtk-layer-shell wayland wayland-protocols libx11 gettext \
            grub freetype2 gsfonts
          id builder >/dev/null 2>&1 || useradd -m builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Testes estáticos
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c 'tests/run.sh'

      - name: Empacotar (sem instalar dependências de runtime)
        run: |
          su builder -c "cd pkgbuild && BIGWM_SOURCE='git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA' makepkg --nodeps --noconfirm"
          ls -l pkgbuild/*.pkg.tar.zst

      - name: namcap (o PKGBUILD tem que ser lido; erros nos pacotes reprovam)
        run: |
          pacman -S --noconfirm --needed namcap
          cd pkgbuild
          # PATH explícito: com /usr/sbin primeiro o namcap confunde os shebangs.
          nc() { su builder -c "env PATH=/usr/local/bin:/usr/bin namcap $*"; }
          # O "Split PKGBUILD needs additional makedepends" só aparece porque
          # as dependências de execução não estão instaladas aqui (--nodeps):
          # fica no log. Reprova se o namcap não conseguir ler o PKGBUILD.
          nc PKGBUILD 2>&1 | tee namcap-PKGBUILD.txt
          if grep -E 'not a valid PKGBUILD|command not found|^Error' namcap-PKGBUILD.txt; then exit 1; fi
          for p in *.pkg.tar.zst; do echo "== $p"; nc "$p"; done | tee namcap.txt
          if grep -E '^[^ ]+ E: ' namcap.txt; then exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: big-wm-packages
          path: pkgbuild/*.pkg.tar.zst
          retention-days: 30

  integration:
    name: Integração (sessões X11 e Wayland com os pacotes reais)
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pacotes deste build (big-wm)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: big-wm-packages
          path: ${{ runner.temp }}/pkgs

      - name: Pacotes de big-windowmaker/packages (último build bem-sucedido em main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in packages-windowmaker packages-wlmaker packages-big-dockapps packages-gtk-nocsd packages-qtstep-kvantum packages-onestepback-gtk-theme packages-retrothemes-firefox; do
            id=$(gh api -X GET repos/big-windowmaker/packages/actions/artifacts -f name="$name" -F per_page=20 \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].id')
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::artefato $name não encontrado"; exit 1; }
            gh api "repos/big-windowmaker/packages/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
            unzip -o -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/pkgs"
            echo "$name: artefato $id" >> "$GITHUB_STEP_SUMMARY"
          done
          find "$RUNNER_TEMP/pkgs" -name '*.pkg.tar.zst' -printf '%f\n' | sort

      - name: Testes de sessão no contêiner Manjaro
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          find "$RUNNER_TEMP/pkgs" -mindepth 2 -name '*.pkg.tar.zst' -exec mv -t "$RUNNER_TEMP/pkgs" {} +
          docker run --rm \
            -v "$GITHUB_WORKSPACE/tests/integration:/t:ro" \
            -v "$RUNNER_TEMP/pkgs:/pkgs:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            docker.io/manjarolinux/base@sha256:a411decb8d219cb4b16b39618e9aa8ce8228acad9cba5b10420f804a20ca5c84 \
            bash /t/session-test.sh /pkgs /out
          { echo '### Resultados'; echo; echo '| teste | resultado | detalhe |'; echo '|---|---|---|';
            tail -n +2 "$RUNNER_TEMP/out/results.tsv" | awk -F'\t' '{printf "| %s | %s | %s |\n", $1, $2, $3}'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados, logs e capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-results
          path: ${{ runner.temp }}/out/
          retention-days: 30

