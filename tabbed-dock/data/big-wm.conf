# Big Tabbed Dock (Big WindowMaker): reinicia o dock se ele cair, sem tocar a
# sessão. Os aplicativos abertos pelo dock vão para escopos próprios do
# systemd (app-big\x2dwm\x2dtabbed\x2ddock-*.scope); KillMode=process é a
# garantia extra de que parar o dock nunca fecha um aplicativo.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2
KillMode=process
