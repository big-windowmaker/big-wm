    <circle cx="43" cy="19.5" r="4.2" fill="#000" fill-opacity="0.30" filter="url(#desfoque-olho)"/>
    <path d="M29 20Q42 11.0 55 20" fill="none" stroke="#000" stroke-opacity="0.20" stroke-width="1.6" filter="url(#desfoque-leve)"/>
  </g>
