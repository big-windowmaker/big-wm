<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Aplicativos (botão do Dock): quatro ladrilhos do Window Maker em
       miniatura, com o monitor, o cubo, o GNUstep e a pasta do tema.
       SPDX-License-Identifier: GPL-2.0-or-later -->
  <title>Aplicativos</title>
  <defs>
    <linearGradient id="ladrilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <g id="quadro">
      <rect width="25" height="25" fill="url(#ladrilho)"/>
      <path d="M.5 24.5V.5H24.5" fill="none" stroke="#fff"/>
      <path d="M.5 24.5H24.5V.5" fill="none" stroke="#000"/>
      <path d="M1.5 23.5H23.5V1.5" fill="none" stroke="#555"/>
    </g>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1680"/>
      <stop offset="1" stop-color="#5262dc"/>
    </linearGradient>
    <radialGradient id="branco" cx=".6" cy=".7" r=".6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="disco"><circle cx="12" cy="12" r="8.5"/></clipPath>
  </defs>
  <rect x="7" y="7" width="54" height="54" fill="#000" fill-opacity=".35" filter="url(#sombra)"/>
  <use href="#quadro" x="6" y="6"/>
  <use href="#quadro" x="33" y="6"/>
  <use href="#quadro" x="6" y="33"/>
  <use href="#quadro" x="33" y="33"/>
  <!-- monitor -->
  <g transform="translate(6 6)">
    <path d="M17.5 6.5 21 8.5V15L17.5 17Z" fill="#c8c8c8" stroke="#6a6a6a" stroke-width=".4"/>
    <rect x="4.5" y="5.5" width="13.5" height="12.5" rx=".8" fill="#f4f4f4" stroke="#7a7a7a" stroke-width=".5"/>
    <rect x="6" y="7" width="10.5" height="9" fill="url(#tela)"/>
    <path d="M7.3 8.6 8.9 9.6 7.3 10.6" fill="none" stroke="#dfe4ff" stroke-width=".7"/>
    <ellipse cx="11" cy="19.8" rx="5.5" ry="1.3" fill="#e0e0e0" stroke="#8a8a8a" stroke-width=".4"/>
  </g>
  <!-- cubo -->
  <g transform="translate(33 6)" stroke="#000" stroke-width=".6" stroke-linejoin="round">
    <path d="M13 4 21 8.5 11 12.5 4 8Z" fill="#e8eee4"/>
    <path d="M4 8 11 12.5 10.5 21.5 4.8 17Z" fill="#1a2a1a"/>
    <path d="M11 12.5 21 8.5 20.5 17 10.5 21.5Z" fill="#1c2c80"/>
    <path d="M6 10.3 5.8 18.4M8.4 11.8 8 19.8M13.5 14.5 16 13.5M13 18 18.5 15.5" stroke="#6fa86a" stroke-width=".7"/>
  </g>
  <!-- GNUstep -->
  <g transform="translate(6 33)">
    <rect x="16" y="6" width="5" height="12" fill="#000"/>
    <rect x="3.5" y="17.5" width="17.5" height="3" fill="#000"/>
    <circle cx="12" cy="12" r="8.5" fill="#000"/>
    <path d="M15 6H21V21H9V12H15Z" fill="url(#branco)" clip-path="url(#disco)"/>
  </g>
  <!-- pasta -->
  <g transform="translate(33 33)" stroke="#262c38" stroke-width=".6" stroke-linejoin="round">
    <path d="M3.5 19.5V6.5H9.5L11 8H20.5V19.5Z" fill="#7e8ba3"/>
    <path d="M3.5 19.5 5.5 10.5H22.5L20.5 19.5Z" fill="#c8d0de"/>
  </g>
</svg>
