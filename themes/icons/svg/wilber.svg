<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- GIMP: o Wilber do wilber.tiff do Window Maker, com o pincel na boca,
       sobre o ladrilho lilás. SPDX-License-Identifier: GPL-2.0-or-later -->
  <title>GIMP</title>
  <defs>
    <linearGradient id="fundo" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8bcd8"/>
      <stop offset="1" stop-color="#e6e8f4"/>
    </linearGradient>
    <linearGradient id="pelo" x1="0" y1="16" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a8a68"/>
      <stop offset=".45" stop-color="#7c6c4e"/>
      <stop offset="1" stop-color="#3e3220"/>
    </linearGradient>
    <radialGradient id="topo" cx="32" cy="26" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#6a4a26"/>
    </radialGradient>
    <radialGradient id="focinho" cx="9" cy="34" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b0b0b0"/>
      <stop offset=".5" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </radialGradient>
    <linearGradient id="cabo" x1="0" y1="-1.6" x2="0" y2="1.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8cc9a"/>
      <stop offset="1" stop-color="#8a6a38"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" fill="url(#fundo)"/>
  <ellipse cx="34" cy="49" rx="22" ry="4" fill="#20203a" fill-opacity=".35" filter="url(#sombra)"/>
  <!-- cabeça, orelhas e corpo -->
  <path d="M9 33.5C10 29 13 27 15.5 26.5L14.6 15.2 22 24.6C27 22.4 37 22.4 42.6 24.2L51 13.6 49 29.6C51.6 33 51.8 38.6 49 42.4 44.5 47.2 33 47.6 24 46.2 16 45 10.6 40.6 9 33.5Z" fill="url(#pelo)" stroke="#2a2014" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M15.4 17.6 16.4 26.4M49.6 16.4 47.6 27" stroke="#c8b892" stroke-width=".8" stroke-linecap="round" stroke-opacity=".7"/>
  <ellipse cx="32.5" cy="26.2" rx="10.4" ry="3.4" fill="url(#topo)"/>
  <path d="M22.4 26.6C27 29.4 38 29.4 42.8 26.4" fill="none" stroke="#b8a882" stroke-width=".8"/>
  <!-- olhos -->
  <ellipse cx="20" cy="32" rx="4.2" ry="3.8" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/>
  <ellipse cx="28.8" cy="32" rx="4.2" ry="3.8" fill="#fff" stroke="#1a1a1a" stroke-width=".8"/>
  <circle cx="21.6" cy="32.4" r="1.9" fill="#000"/>
  <circle cx="30.4" cy="32.4" r="1.9" fill="#000"/>
  <circle cx="21" cy="31.6" r=".6" fill="#fff"/>
  <circle cx="29.8" cy="31.6" r=".6" fill="#fff"/>
  <!-- focinho -->
  <ellipse cx="9.8" cy="35" rx="5.4" ry="4.4" fill="url(#focinho)"/>
  <path d="M14 39.6C18 42.2 24 42.4 29 40.8" fill="none" stroke="#2a2014" stroke-width=".8" stroke-linecap="round"/>
  <!-- pincel na boca -->
  <g transform="translate(29 41.6) rotate(6)">
    <rect x="0" y="-1.4" width="21" height="2.8" rx="1.2" fill="url(#cabo)" stroke="#5a4020" stroke-width=".5"/>
    <rect x="20.5" y="-1.7" width="3.5" height="3.4" fill="#c8ccd0" stroke="#5a5a60" stroke-width=".5"/>
    <path d="M24 -1.7Q29 -1.6 30.5 0 29 1.6 24 1.7Z" fill="#3a3a3a" stroke="#1a1a1a" stroke-width=".4"/>
  </g>
  <path d="M4.5 59.5V4.5H59.5" fill="none" stroke="#6a6a7a" stroke-width="1"/>
  <path d="M5 59.5H59.5V5" fill="none" stroke="#fff" stroke-width="1"/>
</svg>
