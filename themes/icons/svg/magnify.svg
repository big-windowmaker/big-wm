<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Lupa: o Magnify.tiff do Window Maker (aro dourado, cabo de madeira).
       SPDX-License-Identifier: GPL-2.0-or-later -->
  <title>Lupa</title>
  <defs>
    <radialGradient id="vidro" cx="22" cy="19" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4f6fa"/>
      <stop offset=".35" stop-color="#9fd2e0"/>
      <stop offset=".8" stop-color="#4f9cb8"/>
      <stop offset="1" stop-color="#3a7e9a"/>
    </radialGradient>
    <linearGradient id="aro" x1="10" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset=".3" stop-color="#f0c030"/>
      <stop offset=".7" stop-color="#c88c10"/>
      <stop offset="1" stop-color="#7a5200"/>
    </linearGradient>
    <linearGradient id="cabo" x1="0" y1="-3.6" x2="0" y2="3.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e08a4a"/>
      <stop offset=".4" stop-color="#b85a20"/>
      <stop offset="1" stop-color="#6a2c08"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <g fill="#000" fill-opacity=".3" filter="url(#sombra)">
    <circle cx="28.5" cy="27" r="18"/>
    <path d="M40 40 45 35 61 52 56 57Z"/>
  </g>
  <!-- cabo -->
  <g transform="translate(50.5 47.5) rotate(42)">
    <rect x="-12" y="-3.6" width="24" height="7.2" rx="3.6" fill="url(#cabo)" stroke="#4a1c04" stroke-width=".7"/>
    <path d="M-9 -1.4H9" stroke="#f4b07a" stroke-width=".8" stroke-opacity=".7"/>
    <path d="M-5 1.6 1 1.8M4 .9 8 1.2" stroke="#5a2408" stroke-width=".5" stroke-opacity=".6"/>
  </g>
  <!-- colar entre o aro e o cabo -->
  <g transform="translate(38.6 36.7) rotate(42)">
    <rect x="-3.2" y="-3" width="6" height="6" rx="1" fill="url(#aro)" stroke="#6a4400" stroke-width=".6"/>
  </g>
  <!-- lente e aro -->
  <circle cx="26" cy="24" r="15" fill="url(#vidro)"/>
  <path d="M15.5 20.5A11.5 11.5 0 0 1 24.5 12.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".85"/>
  <circle cx="26" cy="24" r="15.4" fill="none" stroke="url(#aro)" stroke-width="3.6"/>
  <circle cx="26" cy="24" r="17.3" fill="none" stroke="#6a4400" stroke-width=".6"/>
  <circle cx="26" cy="24" r="13.5" fill="none" stroke="#6a4400" stroke-width=".6"/>
</svg>
