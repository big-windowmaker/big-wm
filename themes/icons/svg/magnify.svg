<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Lupa: o Magnify.tiff do Window Maker (aro dourado, cabo de madeira),
       com contorno escuro e lente mais contrastada para ler bem em 16-24 px
       (bandeja, notificações, Boas-vindas).
       SPDX-License-Identifier: GPL-2.0-or-later -->
  <title>Lupa</title>
  <defs>
    <radialGradient id="vidro" cx="21" cy="18" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2fbfd"/>
      <stop offset=".3" stop-color="#a9dbe8"/>
      <stop offset=".75" stop-color="#4a96b4"/>
      <stop offset="1" stop-color="#2c6a86"/>
    </radialGradient>
    <linearGradient id="aro" x1="10" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4a8"/>
      <stop offset=".3" stop-color="#f2c434"/>
      <stop offset=".7" stop-color="#c88c10"/>
      <stop offset="1" stop-color="#7a5200"/>
    </linearGradient>
    <linearGradient id="cabo" x1="0" y1="-4.2" x2="0" y2="4.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8955a"/>
      <stop offset=".4" stop-color="#b85a20"/>
      <stop offset="1" stop-color="#5e2606"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- sombra projetada para baixo e à direita (luz de cima e da esquerda) -->
  <g fill="#000" fill-opacity=".3" filter="url(#sombra)">
    <circle cx="28.5" cy="27" r="19"/>
    <path d="M40 39 46 33 62 51 56 57Z"/>
  </g>
  <!-- cabo: mais grosso que o original, com contorno -->
  <g transform="translate(50 47) rotate(42)">
    <rect x="-12.5" y="-4.2" width="25" height="8.4" rx="4.2" fill="url(#cabo)" stroke="#3a1602" stroke-width="1"/>
    <path d="M-9.5 -1.7H9.5" stroke="#f6b884" stroke-width=".9" stroke-opacity=".75" stroke-linecap="round"/>
    <path d="M-5 1.9 1 2.1M4 1.1 8 1.4" stroke="#4a1c04" stroke-width=".55" stroke-opacity=".6"/>
  </g>
  <!-- colar entre o aro e o cabo -->
  <g transform="translate(38.4 36.4) rotate(42)">
    <rect x="-3.4" y="-3.4" width="6.6" height="6.8" rx="1" fill="url(#aro)" stroke="#4a3000" stroke-width=".8"/>
  </g>
  <!-- lente, reflexo e aro -->
  <circle cx="26" cy="24" r="15.2" fill="url(#vidro)"/>
  <path d="M15 20.6A11.8 11.8 0 0 1 24.4 12.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".9"/>
  <circle cx="26" cy="24" r="15.6" fill="none" stroke="url(#aro)" stroke-width="4.2"/>
  <circle cx="26" cy="24" r="17.9" fill="none" stroke="#3a2600" stroke-width="1"/>
  <circle cx="26" cy="24" r="13.4" fill="none" stroke="#5a3c00" stroke-width=".7"/>
  <!-- brilho do aro, em cima à esquerda -->
  <path d="M12.6 17.2A14.6 14.6 0 0 1 21 10" fill="none" stroke="#fffbe0" stroke-width="1.1" stroke-linecap="round" stroke-opacity=".9"/>
</svg>
