<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Visualizador de imagens: o xv.tiff do Window Maker (ladrilho rosado,
       olho ao fundo, "XV").
       SPDX-License-Identifier: GPL-2.0-or-later -->
  <title>Visualizador de imagens</title>
  <defs>
    <linearGradient id="tinta" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a26a6a"/>
      <stop offset=".45" stop-color="#c99494"/>
      <stop offset="1" stop-color="#ecc4c4"/>
    </linearGradient>
    <radialGradient id="nevoa" cx="20" cy="40" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="desfoque" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="desfoque-leve" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="desfoque-olho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <clipPath id="ladrilho"><rect x="4" y="4" width="56" height="56"/></clipPath>
  </defs>
  <rect x="4" y="4" width="56" height="56" fill="url(#tinta)"/>
  <!-- olho esfumado ao fundo, como na foto do original -->
  <g clip-path="url(#ladrilho)">
    <rect x="4" y="4" width="56" height="56" fill="url(#nevoa)"/>
    <ellipse cx="34" cy="18" rx="21" ry="8" fill="#000" fill-opacity="0.30" filter="url(#desfoque)"/>
    <ellipse cx="34" cy="21" rx="15" ry="6" fill="#fff" fill-opacity="0.24" filter="url(#desfoque-leve)"/>
    <circle cx="35" cy="21.5" r="5.1" fill="#000" fill-opacity="0.45" filter="url(#desfoque-olho)"/>
    <path d="M19 22Q34 11.4 49 22" fill="none" stroke="#000" stroke-opacity="0.30" stroke-width="1.6" filter="url(#desfoque-leve)"/>
  </g>
