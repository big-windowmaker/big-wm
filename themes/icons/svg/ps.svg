    <ellipse cx="34" cy="14" rx="21" ry="7.5" fill="#000" fill-opacity="0.23" filter="url(#desfoque)"/>
    <ellipse cx="34" cy="17" rx="15" ry="5.5" fill="#fff" fill-opacity="0.18" filter="url(#desfoque-leve)"/>
    <circle cx="35" cy="17.5" r="4.7" fill="#000" fill-opacity="0.34" filter="url(#desfoque-olho)"/>
    <path d="M19 18Q34 8.2 49 18" fill="none" stroke="#000" stroke-opacity="0.23" stroke-width="1.6" filter="url(#desfoque-leve)"/>
  </g>
