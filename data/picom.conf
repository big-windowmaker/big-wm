# Compositor do Big WindowMaker (X11). Conservador de propósito: sombras
# discretas e transições, sem efeitos que pesem em hardware antigo.
# Este arquivo foi copiado para ~/.config/picom/picom.conf no primeiro login.
#
# Backend xrender: funciona em qualquer driver. Com "glx" e GL por software
# (llvmpipe, máquinas virtuais, drivers sem aceleração) o picom não consegue
# ativar o vsync e deixa janelas novas sem desenhar. Com GPU, quem quiser
# pode trocar para backend = "glx"; vsync = true;.

backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = true;

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.35;
shadow-offset-x = -6;
shadow-offset-y = -6;

fading = true;
fade-delta = 6;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'DockApp' || name ~= '^wm'"; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'"; fade = false; }
);
