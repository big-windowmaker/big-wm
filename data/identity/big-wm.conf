# Identidade do Big WindowMaker como ambiente de trabalho, por cima da
# distribuição-base (o os-release continua o dela sem o big-wm-name).
# Programas que mostram o nome e o logo do sistema (o Big Screen Monitor
# Display, por exemplo) usam estes quando a sessão ativa é uma destas.
NAME="Big WindowMaker"
LOGO=big-wm
LOGO_FILE=/usr/share/icons/hicolor/scalable/apps/big-wm.svg
DESKTOP_NAMES=WindowMaker;wlmaker
