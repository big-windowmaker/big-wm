<?xml version="1.0" encoding="UTF-8"?>
<!-- Big WindowMaker: o ponteiro de "forçar o fechamento" (Ctrl+Alt+Esc),
     caveira vermelha com ossos cruzados, como o "pirate" do xkill.
     Contorno escuro e halo claro: visível em fundos claros e escuros.
     Ponto ativo: o centro (16,16), entre os olhos e o nariz. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g stroke-linecap="round" fill="none">
    <!-- ossos: halo, contorno, osso -->
    <path d="M5 5 L27 27 M27 5 L5 27" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7"/>
    <path d="M5 5 L27 27 M27 5 L5 27" stroke="#1c0000" stroke-width="5"/>
    <path d="M5 5 L27 27 M27 5 L5 27" stroke="#e8d6c8" stroke-width="2.6"/>
  </g>
  <!-- crânio e maxilar -->
  <path id="skull" d="M16 3.2 C9.6 3.2 5.6 7.6 5.6 13.2 C5.6 16.4 7 18.6 9.6 20 L9.6 23.4
           C9.6 25.2 10.8 26.6 12.6 26.6 L19.4 26.6 C21.2 26.6 22.4 25.2 22.4 23.4
           L22.4 20 C25 18.6 26.4 16.4 26.4 13.2 C26.4 7.6 22.4 3.2 16 3.2 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M16 3.2 C9.6 3.2 5.6 7.6 5.6 13.2 C5.6 16.4 7 18.6 9.6 20 L9.6 23.4
           C9.6 25.2 10.8 26.6 12.6 26.6 L19.4 26.6 C21.2 26.6 22.4 25.2 22.4 23.4
           L22.4 20 C25 18.6 26.4 16.4 26.4 13.2 C26.4 7.6 22.4 3.2 16 3.2 Z"
        fill="#d4121a" stroke="#1c0000" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- brilho -->
  <path d="M10 8.6 C11.4 6.6 13.4 5.6 16 5.5" fill="none" stroke="#ff8a8a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- olhos, nariz, dentes -->
  <ellipse cx="11.9" cy="13.4" rx="2.9" ry="3.2" fill="#1c0000"/>
  <ellipse cx="20.1" cy="13.4" rx="2.9" ry="3.2" fill="#1c0000"/>
  <path d="M16 16.6 L14.4 19.6 L17.6 19.6 Z" fill="#1c0000" stroke="#1c0000" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M13.4 22.4 L13.4 25.6 M16 22.4 L16 25.6 M18.6 22.4 L18.6 25.6" stroke="#1c0000" stroke-width="1.3" stroke-linecap="round"/>
</svg>
