# Big WindowMaker: sacudir o mouse aumenta o ponteiro por um instante.
# Copie para ~/.config/big-wm/locate-pointer.conf para mudar; o menu
# Configurações > "Localizar o ponteiro ao sacudir" liga e desliga.
# Vale para as duas sessões: no X11, o big-wm-locate-pointer; no Wayland, o
# próprio wlmaker (LocatePointer), que percebe as mudanças na hora.
#
# enabled=true|false
# sensitivity=low|medium|high   (quantas idas e voltas: 5, 4, 3)
# max-scale=3                   (1.5 a 8 vezes o tamanho do cursor)
# grow-ms=160                   (tempo para crescer, em ms)
# duration-ms=700               (do início até começar a voltar, em ms)
# return-ms=260                 (tempo para voltar ao normal, em ms)
enabled=true
sensitivity=medium
max-scale=3
