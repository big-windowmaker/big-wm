# Big WindowMaker: ampliação da tela na sessão X11 (o plugin do picom
# big-wm-picom-zoom.so). Copie para ~/.config/big-wm/zoom.conf para mudar;
# vale quando o picom começa (ou ao sair e entrar na sessão).
#
#   Ctrl+Alt+rolagem para cima    amplia
#   Ctrl+Alt+rolagem para baixo   reduz
#   Ctrl+Alt+0                    volta ao normal
#
# enabled=true|false     os atalhos de ampliação
# max-level=8            ampliação máxima (1 a 16)
# step=1.25              fator por entalhe da roda (1.05 a 4; 1.25 dobra em ~3)
# animation-ms=120       tempo para deslizar ao novo nível (0 a 2000; 0 = sem)
enabled=true
max-level=8
step=1.25
animation-ms=120
